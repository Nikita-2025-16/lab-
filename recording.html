    <div class="logo">

      <nav class="navigation">
        <ul>
          <li><a href="#">ОСОБИСТИЙ КАБІНЕТ</a></li>
          <li><a href="about.html">ПРО НАС</a></li>

          <li><a href="#">НОВИНИ ТА АКЦІЇ</a></li>
          <li><a href="contacts.html">КОНТАКТИ</a></li>
        </ul>
      </nav>
      <div class="location">
        <img src="location-icon.png" alt="Іконка локації">
        <a href="#">КОНОТОП</a>
      </div>
    </div>
  </header>

  <!-- Основний контент сторінки -->
  <main class="order-container">

    <!-- Бокове меню (пагінація, активний пункт 5) -->
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="index.html">1</a></li>
          <li><a href="page2.html">2</a></li>
          <li><a href="about.html">3</a></li>
          <li><a href="contacts.html">4</a></li>
          <li class="circle is-active"><a href="recording.html">5</a></li>
          <li><a href="#">6</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Заголовок сторінки та кнопка Назад -->
    <h1 class="page-title order-title">Оформлення замовлення</h1>

    <a href="index.html" class="back-link order-back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#43A5EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      На головну
    </a>

    <!-- Картка форми замовлення (Блокова модель) -->
    <div class="order-box">
      <form action="#" method="post" class="order-form">
    
        <div class="form-group">
          <label for="name">ПІП</label>
          <input type="text" name="name" id="name" class="form-field field-name" placeholder="Ваше ім’я" required>
        </div>
    
        <div class="form-group">
          <label for="phone">Номер телефону</label>
          <input type="tel" name="phone" id="phone" class="form-field field-time" placeholder="+38 (097) 999 99 99"
            required>
        </div>
    
        <div class="form-group">
          <label for="time">Бажана дата та час</label>
          <input type="datetime-local" name="time" id="time" class="form-field field-time" required>
        </div>
    
        <div class="form-group">
          <label for="problem">Опис проблеми</label>
          <textarea name="problem" id="problem" class="form-field field-problem" placeholder="Коротко опишіть проблему"
            required></textarea>
        </div>
    
        <button type="submit" class="btn-primary submit-btn">Записатись</button>
      </form>
    </div>

  </main>

  <!-- Підвал із соцмережами -->
  <footer class="footer-socials order-footer">

    </ul>
  </footer>
